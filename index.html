<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>yt-chat-fetcher // AppleSang</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AppleSang/yt-chat-fetcher/refs/heads/main/Icon-YTFetch_1_Resize.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { --avatar-size: 140px; }
    html,body{ height:100%; margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background-color: transparent; }

    .stage { height:100%; display:flex; align-items:flex-end; justify-content:center; padding-bottom:20px; box-sizing:border-box; }

    #msg-container {
      position: relative;
      display: inline-block;
      padding: 28px 24px 20px 24px;
      border-radius: 60px 0 60px 0;
      max-width: 80%;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      margin-bottom: 10px;
      overflow: visible;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }

    #msg { font-size: 2rem; font-weight:700; color:#111; margin:0; position:relative; z-index:2; }

    .example {
      font-size: 1rem;
      color: #222;
      margin-top: 10px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.5s ease, opacity 0.5s ease;
    }
    .example.show { max-height: 2em; opacity: 1; }

    /* Avatar fixed giữa trang */
    .avatar-fixed {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.85);
      padding: 6px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    .avatar-fixed img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; backface-visibility:hidden; }
    .spin { animation: spin 3s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width:480px) { :root { --avatar-size: 96px; } #msg { font-size:1.2rem; } }
  </style>
</head>
<body>
  <div id="avatar-fixed" class="avatar-fixed" aria-hidden="true">
    <img id="avatar-img" src="" alt="Channel avatar">
  </div>

  <div class="stage">
    <div id="msg-container">
      <div id="msg">Checking Status Youtube-Stream ...</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(location.search);
    let identifier = urlParams.get('id');
    const intervalSec = 9;
    
    // ĐƯỜNG DẪN PROXY VERCEL CỦA BẠN
    const proxy = "https://yt-live-proxy.vercel.app/?url=";
    const TIMEOUT = 12000;

    const backgrounds = [
      "https://raw.githubusercontent.com/AppleSang/LumboChat-CSS-Youtube/refs/heads/main/asset/Crimson.webp",
      "https://raw.githubusercontent.com/AppleSang/LumboChat-CSS-Youtube/refs/heads/main/asset/Jade.webp",
      "https://raw.githubusercontent.com/AppleSang/LumboChat-CSS-Youtube/refs/heads/main/asset/Honey.webp",
      "https://raw.githubusercontent.com/AppleSang/LumboChat-CSS-Youtube/refs/heads/main/asset/Sunset.webp"
    ];

    function setRandomBackground(container){
      const bg = backgrounds[Math.floor(Math.random()*backgrounds.length)];
      container.style.backgroundImage = `url('${bg}')`;
      container.style.backgroundRepeat = 'no-repeat';
      container.style.backgroundSize = 'cover';
      container.style.backgroundPosition = 'center';
    }

    (function init(){
      setRandomBackground(document.getElementById('msg-container'));
    })();

    if (identifier && identifier.startsWith('@')) identifier = identifier.substring(1);

    async function fetchWithTimeout(url, options = {}, timeout = TIMEOUT){
      return Promise.race([
        fetch(url, options),
        new Promise((_, reject) => setTimeout(() => reject(new Error("Request Timeout")), timeout))
      ]);
    }

    async function resolveChannelId(id){
      if (!id) return null;
      if (/^UC[0-9A-Za-z_-]{22}$/.test(id)) return id;
      const urls = [
        "https://www.youtube.com/user/" + id,
        "https://www.youtube.com/@" + id,
        "https://www.youtube.com/c/" + id
      ];
      for (const url of urls) {
        try {
          // GỌI THÊM &raw=true ĐỂ LẤY RAW HTML TỪ VERCEL TRẢ VỀ
          const res = await fetchWithTimeout(proxy + encodeURIComponent(url) + "&raw=true");
          const html = await res.text();
          const match = html.match(/rel=["']canonical["'] href=["']https:\/\/www\.youtube\.com\/channel\/(UC[\w-]{22})["']/i);
          if (match) return match[1];
        } catch (e) {
          console.warn("resolveChannelId error:", e.message);
        }
      }
      return null;
    }

    // 🛠️ ĐÃ THÊM &raw=true VÀ THỰC HIỆN LOGIC QUET THEO /LIKE/LIKE TRÊN TRÌNH DUYỆT TRỰC TIẾP
    async function checkLive(channelId){
      try {
        const targetUrl = `https://www.youtube.com/channel/${channelId}/live`;
        // Gửi lệnh proxy kèm theo tham số &raw=true ép Vercel trả về mã nguồn thô hoàn toàn
        const res = await fetchWithTimeout(proxy + encodeURIComponent(targetUrl) + "&raw=true");
        
        // Nếu trang lỗi hoặc chuyển hướng (kênh offline) thì ngắt
        if (res.status === 301 || res.status === 302 || res.status === 404) return null;

        const htmlContent = await res.text();

        // 🎯 LỌC DỰA TRÊN REGEX LIKE NHƯ BẠN YÊU CẦU TỪ FILE RAW HTML TRẢ VỀ
        const likeRegex = /"apiUrl"\s*:\s*"\/youtubei\/v1\/like\/like".*?"videoId"\s*:\s*"([\w-]{11})"/s;
        const match = htmlContent.match(likeRegex);
        if (match && match[1]) {
          return match[1]; // Trả về videoId chính xác của phòng live
        }

        // Dự phòng 2: Quét watchEndpoint phòng live chuẩn của YouTube
        const ytCommandMatch = htmlContent.match(/"watchEndpoint"\s*:\s*\{\s*"videoId"\s*:\s*"([\w-]{11})"/);
        if (ytCommandMatch && ytCommandMatch[1]) {
          return ytCommandMatch[1];
        }
      } catch (e) {
        console.warn("checkLive error:", e.message);
      }
      return null;
    }

    async function fetchChannelAvatar(channelId){
      try {
        const targetUrl = `https://www.youtube.com/channel/${channelId}`;
        // GỌI THÊM &raw=true ĐỂ LẤY FILE HTML GỐC CHO HÀM AVATAR
        const res = await fetchWithTimeout(proxy + encodeURIComponent(targetUrl) + "&raw=true");
        const html = await res.text();
        
        let m = html.match(/<meta\s+property=["']og:image["']\s+content=["']([^"']+)["']/i);
        if (m && m[1]) return normalizeAvatarUrl(m[1]);
        m = html.match(/<link\s+rel=["']image_src["']\s+href=["']([^"']+)["']/i);
        if (m && m[1]) return normalizeAvatarUrl(m[1]);
        m = html.match(/"avatar":[^"]*"url":"([^"]+)"/i);
        if (m && m[1]) return normalizeAvatarUrl(m[1].replace(/\\u0026/g,'&'));
      } catch (e) {
        console.warn("fetchChannelAvatar error:", e.message);
      }
      return null;
    }

    function normalizeAvatarUrl(url){
      if (!url) return url;
      url = url.replace(/\\u0026/g,'&').replace(/\\\//g,'/');
      if (url.startsWith('//')) url = 'https:' + url;
      if (url.startsWith('/')) url = 'https://www.youtube.com' + url;
      return url;
    }

    function showAvatarFixed(url, spinning = true){
      const wrapper = document.getElementById('avatar-fixed');
      const img = document.getElementById('avatar-img');
      if (!url) {
        wrapper.style.display = 'none';
        img.src = '';
        img.classList.remove('spin');
        return;
      }
      img.src = url;
      wrapper.style.display = 'flex';
      if (spinning) img.classList.add('spin'); else img.classList.remove('spin');
    }

    function updateMsg(text){
      const el = document.getElementById('msg');
      if (el) el.textContent = text;
    }

    function showErrorExampleLoop(container){
      if (container.querySelector('.example')) return;
      const example = document.createElement('div');
      example.className = 'example';
      container.appendChild(example);
      const texts = [
        'Example URL: https://applesang.github.io/yt-chat-fetcher/?id=UCEcZC1dyDrhWueALsmutdHA',
        'Example URL: https://applesang.github.io/yt-chat-fetcher/?id=NotRealSang'
      ];
      let index = 0;
      function cycle(){
        example.textContent = texts[index];
        example.classList.add('show');
        setTimeout(()=> { example.classList.remove('show'); }, 4000);
        setTimeout(()=> {
          index = (index + 1) % texts.length;
          cycle();
        }, 5000);
      }
      setTimeout(cycle, 50);
    }

    function startCountdown(chId, sec){
      let s = sec;
      updateMsg(`👀 Stream not found, retrying in ${s} seconds...`);
      const t = setInterval(async ()=>{
        s--;
        if (s>0) updateMsg(`👀 Stream not found, retrying in ${s} seconds...`);
        else {
          clearInterval(t);
          updateMsg('🔁 Retrying...');
          const vid = await checkLive(chId);
          if (vid) {
            showAvatarFixed(null, false);
            window.location.href = `https://www.youtube.com/live_chat?is_popout=1&v=${vid}`;
          } else {
            startCountdown(chId, intervalSec);
          }
        }
      }, 1000);
    }

    async function start(){
      try {
        if (!identifier) {
          const container = document.getElementById('msg-container');
          container.innerHTML = `<div id="msg">⚠️ Wrong URL! Please Read <a href="https://github.com/AppleSang/yt-chat-fetcher?tab=readme-ov-file#how-to-setup-but-detailed" target="_blank">Guide</a> Again `;
          setRandomBackground(container);
          showErrorExampleLoop(container);
          return;
        }

        updateMsg('🔍 Finding Your Channel...');
        const chId = await resolveChannelId(identifier);
        if (!chId) {
          updateMsg(`❌ Can't Found Channel With '${identifier}'. Please re-check!`);
          const container = document.getElementById('msg-container');
          showErrorExampleLoop(container);
          return;
        }

        const avatarUrl = await fetchChannelAvatar(chId);
        if (avatarUrl) showAvatarFixed(avatarUrl, true);
        else showAvatarFixed(null);

        updateMsg('🟡 Getting Livestream Code...');
        const vid = await checkLive(chId);
        if (vid) {
          showAvatarFixed(null, false);
          window.location.href = `https://www.youtube.com/live_chat?is_popout=1&v=${vid}`;
        } else {
          startCountdown(chId, intervalSec);
        }
      } catch (e) {
        console.warn("start error:", e.message);
        showAvatarFixed(null);
        setTimeout(start, TIMEOUT);
      }
    }

    start();
  </script>
</body>
</html>
