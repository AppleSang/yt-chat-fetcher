<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>yt-chat-fetcher // AppleSang</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AppleSang/yt-chat-fetcher/refs/heads/main/Icon-YTFetch_1_Resize.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { --avatar-size: 140px; }
    html,body{ height:100%; margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background-color: transparent; }

    .stage { height:100%; display:flex; align-items:flex-end; justify-content:center; padding-bottom:20px; box-sizing:border-box; }

    #msg-container {
      position: relative;
      display: inline-block;
      padding: 28px 24px 20px 24px;
      border-radius: 60px 0 60px 0;
      max-width: 80%;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      margin-bottom: 10px;
      overflow: visible;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }

    #msg { font-size: 2rem; font-weight:700; color:#111; margin:0; position:relative; z-index:2; }
    .obs-permission-warning {
      margin: 0 0 12px;
      padding: 10px 14px;
      border: 1px solid #dc2626;
      border-radius: 12px;
      background: rgba(254, 226, 226, 0.96);
      color: #991b1b;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .example {
      font-size: 1rem;
      color: #222;
      margin-top: 10px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.5s ease, opacity 0.5s ease;
    }
    .example.show { max-height: 2em; opacity: 1; }

    /* Avatar fixed giữa trang */
    .avatar-fixed {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.85);
      padding: 6px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    .avatar-fixed img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; backface-visibility:hidden; }
    .spin { animation: spin 3s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width:480px) { :root { --avatar-size: 96px; } #msg { font-size:1.2rem; } }
  </style>
</head>
<body>
  <div id="avatar-fixed" class="avatar-fixed" aria-hidden="true">
    <img id="avatar-img" src="https://raw.githubusercontent.com/AppleSang/yt-chat-fetcher/refs/heads/main/Icon-YTFetch_1_Resize.png" alt="">
  </div>

  <div class="stage">
    <div id="msg-container">
      <div id="msg" data-i18n="checkingYoutube">🔎 yt-chat-fetcher // AppleSang 🍎</div>
    </div>
  </div>

  <script>
    const translations = {
      vi: {
        pageTitle: 'yt-chat-fetcher // AppleSang',
        checkingYoutube: 'Đang kiểm tra trạng thái livestream YouTube...',
        wrongUrlPrefix: '⚠️ URL không hợp lệ! Vui lòng đọc lại ',
        guide: 'hướng dẫn',
        wrongUrlSuffix: '.',
        findingChannel: '🔍 Đang tìm kênh của bạn...',
        channelNotFound: "❌ Không tìm thấy kênh '{identifier}'. Vui lòng kiểm tra lại!",
        exampleUrl: 'Ví dụ URL:',
        streamNotFound: '👀 Chưa tìm thấy livestream, thử lại sau {seconds} giây...',
        retrying: '🔁 Đang thử lại...',
        gettingLive: '🟡 Đang kiểm tra livestream...',
        obsPermissionWarning: '⚠ OBS: hãy đặt Page permissions thành Read OBS Data ở trong Properties của Browser Source.',
        waitingForObs: '⏳ Đang chờ OBS bắt đầu stream...'
      },
      en: {
        pageTitle: 'yt-chat-fetcher // AppleSang',
        checkingYoutube: 'Checking YouTube livestream status...',
        wrongUrlPrefix: '⚠️ Wrong URL! Please read the ',
        guide: 'guide',
        wrongUrlSuffix: ' again.',
        findingChannel: '🔍 Finding your channel...',
        channelNotFound: "❌ Cannot find channel '{identifier}'. Please check it again!",
        exampleUrl: 'Example URL:',
        streamNotFound: '👀 Stream not found, retrying in {seconds} seconds...',
        retrying: '🔁 Retrying...',
        gettingLive: '🟡 Getting livestream code...',
        obsPermissionWarning: '⚠ OBS: Set the Page permissions to "Read OBS Data" in the Browser Source properties.',
        waitingForObs: '⏳ Waiting for OBS to start streaming...'
      }
    };

    let language = 'en';

    function t(key, values = {}) {
      const text = translations[language][key] || translations.en[key] || key;
      return text.replace(/\{(\w+)\}/g, (_, name) => values[name] ?? `{${name}}`);
    }

    async function detectLanguageByIp() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 2500);

      try {
        const response = await fetch('https://ipwho.is/', { signal: controller.signal });
        const location = await response.json();
        if (response.ok && location.success && location.country_code === 'VN') {
          language = 'vi';
        }
      } catch (error) {
        console.warn('Could not determine country from IP:', error.message);
      } finally {
        clearTimeout(timeout);
      }

      document.documentElement.lang = language;
      document.title = t('pageTitle');
      const initialMessage = document.querySelector('[data-i18n="checkingYoutube"]');
      if (initialMessage) initialMessage.textContent = t('checkingYoutube');
    }

    const urlParams = new URLSearchParams(location.search);
    let identifier = urlParams.get('id');
    const intervalSec = 6;
    
    // ĐƯỜNG DẪN PROXY VERCEL CỦA BẠN
    const proxy = "https://yt-live-proxy.vercel.app/?url=";
    const TIMEOUT = 12000;

    const backgrounds = [
      "https://raw.githubusercontent.com/AppleSang/LumboChat-CSS-Youtube/refs/heads/main/asset/Crimson.webp",
      "https://raw.githubusercontent.com/AppleSang/LumboChat-CSS-Youtube/refs/heads/main/asset/Jade.webp",
      "https://raw.githubusercontent.com/AppleSang/LumboChat-CSS-Youtube/refs/heads/main/asset/Honey.webp",
      "https://raw.githubusercontent.com/AppleSang/LumboChat-CSS-Youtube/refs/heads/main/asset/Sunset.webp"
    ];

    function setRandomBackground(container){
      const bg = backgrounds[Math.floor(Math.random()*backgrounds.length)];
      container.style.backgroundImage = `url('${bg}')`;
      container.style.backgroundRepeat = 'no-repeat';
      container.style.backgroundSize = 'cover';
      container.style.backgroundPosition = 'center';
    }

    (function init(){
      setRandomBackground(document.getElementById('msg-container'));
    })();

    if (identifier && identifier.startsWith('@')) identifier = identifier.substring(1);

    async function fetchWithTimeout(url, options = {}, timeout = TIMEOUT){
      return Promise.race([
        fetch(url, options),
        new Promise((_, reject) => setTimeout(() => reject(new Error("Request Timeout")), timeout))
      ]);
    }

    async function resolveChannelId(id){
      if (!id) return null;
      if (/^UC[0-9A-Za-z_-]{22}$/.test(id)) return id;
      const urls = [
        "https://www.youtube.com/@" + id,
        "https://www.youtube.com/c/" + id
      ];
      for (const url of urls) {
        try {
          const res = await fetchWithTimeout(proxy + encodeURIComponent(url) + "&raw=true");
          const html = await res.text();
          const match = html.match(/rel=["']canonical["'] href=["']https:\/\/www\.youtube\.com\/channel\/(UC[\w-]{22})["']/i);
          if (match) return match[1];
        } catch (e) {
          console.warn("resolveChannelId error:", e.message);
        }
      }
      return null;
    }

    // 🛠️ HÀM CHECK LIVE KIỂM TRA PHẢI CÓ "isLive":true THÌ MỚI ĐẨY ĐI
    async function checkLive(channelId){
      console.log(`[checkLive] Bắt đầu kiểm tra channelId: ${channelId}`);

      // Cách 1: HTML parsing
      try {
        const targetUrl = `https://www.youtube.com/channel/${channelId}/live`;
        console.log(`[checkLive] Cách 1: Gọi proxy HTML...`);
        const res = await fetchWithTimeout(proxy + encodeURIComponent(targetUrl) + "&raw=true");
        console.log(`[checkLive] Cách 1: Response status = ${res.status}`);
        
        if (res.status === 301 || res.status === 302 || res.status === 404) {
          console.log(`[checkLive] Cách 1: Bỏ qua (status ${res.status})`);
        } else {
          const htmlContent = await res.text();
          console.log(`[checkLive] Cách 1: Đã nhận HTML ${htmlContent.length} ký tự`);

          const hasLiveSignal = htmlContent.includes('"isLive":true') || htmlContent.includes('"isLiveStream":true') || htmlContent.includes('iconType":"LIVE"');
          console.log(`[checkLive] Cách 1: hasLiveSignal = ${hasLiveSignal}`);
          
          if (hasLiveSignal) {
            const likeRegex = /"apiUrl"\s*:\s*"\/youtubei\/v1\/like\/like".*?"videoId"\s*:\s*"([\w-]{11})"/s;
            const match = htmlContent.match(likeRegex);
            if (match && match[1]) {
              console.log(`[checkLive] Cách 1: Tìm thấy videoId via likeRegex = ${match[1]}`);
              return match[1]; 
            }
            console.log(`[checkLive] Cách 1: likeRegex không khớp`);

            const ytCommandMatch = htmlContent.match(/"watchEndpoint"\s*:\s*\{\s*"videoId"\s*:\s*"([\w-]{11})"/);
            if (ytCommandMatch && ytCommandMatch[1]) {
              console.log(`[checkLive] Cách 1: Tìm thấy videoId via watchEndpoint = ${ytCommandMatch[1]}`);
              return ytCommandMatch[1];
            }
            console.log(`[checkLive] Cách 1: watchEndpoint không khớp → chuyển cách 2`);
          } else {
            console.log(`[checkLive] Cách 1: Không phát hiện tín hiệu LIVE → chuyển cách 2`);
          }
        }
      } catch (e) {
        console.warn(`[checkLive] Cách 1 lỗi:`, e.message);
      }

      // Cách 2 (Fallback): ?raw=true → text response
      try {
        const fallbackUrl = `https://www.youtube.com/channel/${channelId}/live?raw=true`;
        console.log(`[checkLive] Cách 2: Gọi proxy ?raw=true...`);
        const res2 = await fetchWithTimeout(proxy + encodeURIComponent(fallbackUrl));
        console.log(`[checkLive] Cách 2: Response status = ${res2.status}`);
        if (res2.status === 200) {
          const text = (await res2.text()).trim();
          console.log(`[checkLive] Cách 2: Response text = "${text}" (length=${text.length})`);
          if (text && text.length >= 10 && text.length <= 12) {
            console.log(`[checkLive] Cách 2: Trả về videoId = ${text}`);
            return text;
          }
          console.log(`[checkLive] Cách 2: Text không phải videoId hợp lệ`);
        }
      } catch (e) {
        console.warn(`[checkLive] Cách 2 lỗi:`, e.message);
      }

      console.log(`[checkLive] Không tìm thấy videoId`);
      return null;
    }

    async function fetchChannelAvatar(channelId){
      try {
        const targetUrl = `https://www.youtube.com/channel/${channelId}`;
        const res = await fetchWithTimeout(proxy + encodeURIComponent(targetUrl) + "&raw=true");
        const html = await res.text();
        
        let m = html.match(/<meta\s+property=["']og:image["']\s+content=["']([^"']+)["']/i);
        if (m && m[1]) return normalizeAvatarUrl(m[1]);
        m = html.match(/<link\s+rel=["']image_src["']\s+href=["']([^"']+)["']/i);
        if (m && m[1]) return normalizeAvatarUrl(m[1]);
        m = html.match(/"avatar":[^"]*"url":"([^"]+)"/i);
        if (m && m[1]) return normalizeAvatarUrl(m[1].replace(/\\u0026/g,'&'));
      } catch (e) {
        console.warn("fetchChannelAvatar error:", e.message);
      }
      return null;
    }

    function normalizeAvatarUrl(url){
      if (!url) return url;
      url = url.replace(/\\u0026/g,'&').replace(/\\\//g,'/');
      if (url.startsWith('//')) url = 'https:' + url;
      if (url.startsWith('/')) url = 'https://www.youtube.com' + url;
      return url;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('msg-container');
      if (container) setRandomBackground(container);
    });

    function showAvatarFixed(url, spinning = true){
      const wrapper = document.getElementById('avatar-fixed');
      const img = document.getElementById('avatar-img');
      if (!wrapper || !img) return;
      if (!url) {
        wrapper.style.display = 'none';
        img.src = '';
        img.classList.remove('spin');
        return;
      }
      img.src = url;
      wrapper.style.display = 'flex';
      if (spinning) img.classList.add('spin'); else img.classList.remove('spin');
    }

    function updateMsg(text){
      const el = document.getElementById('msg');
      if (el) el.textContent = text;
    }

    function showObsPermissionWarning(){
      const container = document.getElementById('msg-container');
      if (!container || container.querySelector('.obs-permission-warning')) return;
      const warning = document.createElement('div');
      warning.className = 'obs-permission-warning';
      warning.textContent = t('obsPermissionWarning');
      container.insertBefore(warning, container.firstChild);
    }

    function showErrorExampleLoop(container){
      if (container.querySelector('.example')) return;
      const example = document.createElement('div');
      example.className = 'example';
      container.appendChild(example);
      const texts = [
        `${t('exampleUrl')} https://applesang.github.io/yt-chat-fetcher/?id=UCEcZC1dyDrhWueALsmutdHA`,
        `${t('exampleUrl')} https://applesang.github.io/yt-chat-fetcher/?id=NotRealSang`
      ];
      let index = 0;
      function cycle(){
        example.textContent = texts[index];
        example.classList.add('show');
        setTimeout(()=> { example.classList.remove('show'); }, 4000);
        setTimeout(()=> {
          index = (index + 1) % texts.length;
          cycle();
        }, 5000);
      }
      setTimeout(cycle, 50);
    }

    let countdownTimer = null;

    function startCountdown(chId, sec){
      if (countdownTimer) clearInterval(countdownTimer);
      let s = sec;
      updateMsg(t('streamNotFound', { seconds: s }));
      countdownTimer = setInterval(async ()=>{
        s--;
        if (s > 0) {
          updateMsg(t('streamNotFound', { seconds: s }));
        } else {
          clearInterval(countdownTimer);
          countdownTimer = null;
          updateMsg(t('retrying'));
          fetchLiveChat(chId);
        }
      }, 1000);
    }

    async function fetchLiveChat(chId){
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      updateMsg(t('gettingLive'));
      const vid = await checkLive(chId);

      if (vid && vid.length === 11) {
        showAvatarFixed(null, false);
        window.location.href = `https://www.youtube.com/live_chat?is_popout=1&v=${vid}`;
      } else {
        startCountdown(chId, intervalSec);
      }
    }

    let hasStartedFetching = false;

    async function start(){
      if (hasStartedFetching) return;
      hasStartedFetching = true;
      try {
        if (!identifier) {
          const container = document.getElementById('msg-container');
          container.innerHTML = `<div id="msg">${t('wrongUrlPrefix')}<a href="https://github.com/AppleSang/yt-chat-fetcher?tab=readme-ov-file#how-to-setup-but-detailed" target="_blank">${t('guide')}</a>${t('wrongUrlSuffix')}</div>`;
          setRandomBackground(container);
          showErrorExampleLoop(container);
          return;
        }

        updateMsg(t('findingChannel'));
        const chId = await resolveChannelId(identifier);
        if (!chId) {
          updateMsg(t('channelNotFound', { identifier }));
          const container = document.getElementById('msg-container');
          showErrorExampleLoop(container);
          return;
        }

        const avatarUrl = await fetchChannelAvatar(chId);
        if (avatarUrl) showAvatarFixed(avatarUrl, true);
        else showAvatarFixed(null);

        startAfterChannelIsReady(chId);
      } catch (e) {
        console.warn("start error:", e.message);
        showAvatarFixed(null);
        hasStartedFetching = false;
        setTimeout(start, TIMEOUT);
      }
    }

    function startAfterChannelIsReady(chId){
      if (!window.obsstudio || typeof window.obsstudio.getControlLevel !== 'function') {
        fetchLiveChat(chId);
        return;
      }

      window.addEventListener('obsStreamingStarted', () => fetchLiveChat(chId), { once: true });

      window.obsstudio.getControlLevel((level) => {
        if (level < 1 || typeof window.obsstudio.getStatus !== 'function') {
          showObsPermissionWarning();
          fetchLiveChat(chId);
          return;
        }

        window.obsstudio.getStatus((status) => {
          if (status.streaming) {
            fetchLiveChat(chId);
          } else {
            updateMsg(t('waitingForObs'));
          }
        });
      });
    }

    detectLanguageByIp().finally(start);
  </script>
</body>
</html>
